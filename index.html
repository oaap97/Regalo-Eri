<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #06040d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 13, 32, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,215,0,0.05);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .chapter-tag {
      font-size: 0.75rem;
      color: #ffd700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    /* Marco del Personaje */
    .character-box {
      width: 160px;
      height: 160px;
      margin: 0 auto 10px;
      position: relative;
    }
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.35));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Canvas para Limpiar la Niebla sobre BimBin */
    #fog-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      z-index: 5;
      cursor: pointer;
      touch-action: none;
    }

    /* Caja de Diálogo RPG */
    .dialogue-box {
      background: rgba(8, 5, 16, 0.96);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 18px;
      padding: 16px;
      margin: 12px 0;
      min-height: 125px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.65;
      color: #e3ddff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.7);
    }

    .speaker-name {
      font-size: 0.8rem;
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Botones y Opciones */
    .interactive-area {
      margin: 10px 0;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #0c0914;
      font-weight: 600;
      border: none;
      padding: 13px 20px;
      border-radius: 50px;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 215, 0, 0.25);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:active { transform: scale(0.96); }

    /* Mini-Juego: Piedras Volcánicas de Tharun */
    .stone-slots {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 10px 0;
    }
    .stone-node {
      width: 80px;
      height: 80px;
      border: 2px dashed rgba(255,215,0,0.5);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.72rem;
      color: #dcd6f7;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      transition: all 0.3s ease;
    }
    .stone-node.active {
      border-style: solid;
      border-color: #ff5500;
      background: radial-gradient(circle, rgba(255,85,0,0.4), rgba(20,10,5,0.8));
      box-shadow: 0 0 18px #ff5500;
      color: #fff;
    }

    /* Mapa de Estrellas de La Rosa Náutica */
    .star-map {
      width: 100%;
      height: 110px;
      background: rgba(8,18,35,0.85);
      border: 1px dashed rgba(255,215,0,0.4);
      border-radius: 16px;
      position: relative;
      margin: 8px 0;
    }
    .star-point {
      width: 34px;
      height: 34px;
      background: #ffd700;
      border-radius: 50%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.78rem;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #ffd700;
      transition: transform 0.2s;
    }
    .star-point.active {
      background: #00ffcc;
      box-shadow: 0 0 20px #00ffcc;
    }

    /* Flip Card para el Regalo */
    .flip-card {
      width: 100%;
      height: 220px;
      perspective: 1000px;
      margin: 10px 0;
      display: none;
    }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%; height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px;

      cursor: pointer;
    }
    .flip-card-back {
      background: linear-gradient(135deg, rgba(25,20,45,0.95), rgba(10,5,20,0.98));
      color: white;
      transform: rotateY(180deg);

    }

    .music-btn {

      top: 15px; right: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

  <script>
    // WEB AUDIO API: SINTETIZADOR POTENCIADO DE "VOICE BLIPS"
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playVoiceBlip(character) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      let freq = 650;
      if (character === "Tharun") freq = 280; // Grave y calmado
      if (character === "Lyra") freq = 980;   // Cristalino y vibrante
      if (character === "BimBin") freq = 620 + Math.random() * 120; // Alegre y juguetón

      osc.type = character === "Lyra" ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      // Volumen aumentado para sobrepasar suavemente la música de fondo
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.07);
    }

    // BASE DE DATOS DE HISTORIA EXTENDIDA Y DETALLADA

        beats: [
          {

          {

      // ESCENA 3: BIMBIM & LA ROSA NÁUTICA (HISTORIA EXTENDIDA)
      {

            type: "show_card"

        ],
        cardContent: `
          <h3 style="color:#ffd700; margin-bottom:6px;">🍷 Festín en La Rosa Náutica</h3>
          <p style="font-size:0.85rem; line-height:1.5;">Almuerzo de celebración sobre el océano Pacífico junto a la <strong>Reina Madre (tu mamá)</strong> y quien te ama.</p>
        `

      // ESCENA 4: EPÍLOGO Y CIERRE
      {
        chapter: "EPÍLOGO",
        title: "¡Feliz Cumpleaños, Eri!",
        speaker: "BimBin y tu Novio",
        image: "Bimbin-removebg-preview_20260726_231003_0000.png",
        beats: [
          {
            text: "Has completado el viaje de la Triple Corona. Cada una de estas tres experiencias ha sido elegida con todo el amor del mundo para que descanses, brilles y celebres lo increíble que eres.",
            type: "final_summary"
          }
        ]

    let currentSceneIdx = 0;
    let currentBeatIdx = 0;

    const bgMusic = document.getElementById('bgMusic');
    const sfxMagic = document.getElementById('sfxMagic');
    const sfxOcean = document.getElementById('sfxOcean');

    // Partículas de fondo
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = Array.from({length: 30}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.2,
      speed: Math.random() * 0.3 + 0.1
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
        ctx.fill();
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // CANVA DE NIEBLA (Scratch Off) PARA EL PRÓLOGO
    function initFogCanvas() {
      const fogCanvas = document.getElementById('fog-canvas');
      const fogCtx = fogCanvas.getContext('2d');
      fogCanvas.width = 160;
      fogCanvas.height = 160;

      // Pintar capa helada de niebla
      fogCtx.fillStyle = 'rgba(180, 195, 220, 0.92)';
      fogCtx.fillRect(0, 0, 160, 160);
      fogCtx.font = '600 11px Poppins';
      fogCtx.fillStyle = '#110c22';
      fogCtx.textAlign = 'center';
      fogCtx.fillText('FROTA AQUÍ ✨', 80, 80);
      fogCtx.fillText('PARA LIMPIAR', 80, 95);

      let isScratching = false;

      function scratch(e) {
        if (!isScratching) return;
        const rect = fogCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        fogCtx.globalCompositeOperation = 'destination-out';
        fogCtx.beginPath();
        fogCtx.arc(x, y, 22, 0, Math.PI * 2);
        fogCtx.fill();
      }

      fogCanvas.addEventListener('mousedown', (e) => { isScratching = true; scratch(e); });
      fogCanvas.addEventListener('mousemove', scratch);
      fogCanvas.addEventListener('mouseup', () => { isScratching = false; checkScratchProgress(); });

      fogCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); });
      fogCanvas.addEventListener('touchmove', scratch);
      fogCanvas.addEventListener('touchend', () => { isScratching = false; checkScratchProgress(); });
    }

    function checkScratchProgress() {
      const fogCanvas = document.getElementById('fog-canvas');
      fogCanvas.style.transition = 'opacity 0.8s ease';
      fogCanvas.style.opacity = '0';
      setTimeout(() => {
        fogCanvas.style.display = 'none';
        sfxMagic.play();
        advanceBeat();
      }, 700);
    }

    // Typewriter con sonidito Blip por letra
    function typeWriter(text, speaker, callback) {
      let i = 0;
      const speed = 24;
      const element = document.getElementById('dialogue-text');
      element.innerHTML = "";

      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          if (i % 2 === 0) playVoiceBlip(speaker);
          i++;
          setTimeout(type, speed);
        } else {
          if (callback) callback();
        }
      }
      type();
    }

    function renderScene() {
      const scene = storyData[currentSceneIdx];
      document.getElementById('chapter-tag').innerText = scene.chapter;
      document.getElementById('scene-title').innerText = scene.title;
      document.getElementById('speaker-name').innerText = scene.speaker;
      document.getElementById('character-img').src = scene.image;

      const fogCanvas = document.getElementById('fog-canvas');
      if (currentSceneIdx === 0 && currentBeatIdx === 0) {
        fogCanvas.style.display = 'block';
        fogCanvas.style.opacity = '1';
        initFogCanvas();
      } else {
        fogCanvas.style.display = 'none';
      }

      document.getElementById('flip-card').style.display = 'none';
      document.getElementById('flip-card').classList.remove('flipped');

      renderBeat();
    }

    function renderBeat() {
      const scene = storyData[currentSceneIdx];
      const beat = scene.beats[currentBeatIdx];
      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      typeWriter(beat.text, scene.speaker, () => {
        if (beat.type === "choice") {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = beat.btnText;
          btn.onclick = () => {
            if (currentSceneIdx === 0 && currentBeatIdx === 1) {
              // Hilo musical sutil al 12% para no opacar voces
              bgMusic.volume = 0.12;
              bgMusic.play().catch(e => console.log(e));
            }
            advanceBeat();
          };
          area.appendChild(btn);
        }

        else if (beat.type === "stone_game") {
          let stonesCount = 0;
          area.innerHTML = `
            <div class="stone-slots">
              <div class="stone-node" id="st1"><span>🌋</span>Hombros</div>
              <div class="stone-node" id="st2"><span>🌋</span>Espalda</div>
              <div class="stone-node" id="st3"><span>🌋</span>Mente</div>
            </div>
          `;
          ['st1', 'st2', 'st3'].forEach(id => {
            document.getElementById(id).onclick = function() {
              if (!this.classList.contains('active')) {
                this.classList.add('active');
                sfxMagic.play();
                stonesCount++;
                if (stonesCount === 3) {
                  setTimeout(advanceBeat, 600);
                }
              }
            };
          });
        }

        else if (beat.type === "style_choice_1") {
          area.innerHTML = `
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">✂️ Corte Capas Fluidas & Movimiento</button>
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">✂️ Estilo Bob Moderno & Elegante</button>
          `;
        }

        else if (beat.type === "style_choice_2") {
          area.innerHTML = `
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">🌟 Tono Reflejo Dorado Sol</button>
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">✨ Tono Cobre Cálido Iluminado</button>
          `;
        }

        else if (beat.type === "star_game") {
          let count = 0;
          const map = document.createElement('div');
          map.className = 'star-map';
          map.innerHTML = `
            <div class="star-point" style="top:20px; left:20px;" id="s1">Eri</div>
            <div class="star-point" style="top:55px; left:50%; transform:translateX(-50%);" id="s2">Novio</div>
            <div class="star-point" style="top:20px; right:20px;" id="s3">Mamá</div>
          `;
          area.appendChild(map);

          ['s1','s2','s3'].forEach((id) => {
            document.getElementById(id).onclick = function() {
              if(!this.classList.contains('active')) {
                this.classList.add('active');
                sfxMagic.play();
                count++;
                if(count === 3) {
                  setTimeout(advanceBeat, 600);
                }
              }
            };
          });
        }

        else if (beat.type === "show_card") {
          document.getElementById('card-back-content').innerHTML = scene.cardContent;
          document.getElementById('flip-card').style.display = 'block';
        }

        else if (beat.type === "final_summary") {
          sfxOcean.pause();
          confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
          area.innerHTML = `
            <div style="background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3); padding: 14px; border-radius: 16px; text-align: left; font-size: 0.82rem; line-height: 1.8;">
              🌿 <strong>Acto I:</strong> Relax & Masaje Coco Premium (Vita Lima Spa)<br>
              ✂️ <strong>Acto II:</strong> Corte & Coloración de Cabello<br>
              🌊 <strong>Acto III:</strong> Almuerzo en La Rosa Náutica
            </div>
            <p style="font-size:0.85rem; color:#ffd700; font-weight:600; margin-top:12px;">Con todo nuestro amor,<br>Tu novio y BimBin.</p>
          `;
        }
      });
    }

    function revealGiftCard() {
      sfxMagic.currentTime = 0;
      sfxMagic.play();

      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');

      if (currentSceneIdx === 3) {
        sfxOcean.volume = 0.5;
        sfxOcean.play();
      }

      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.marginTop = '10px';
      btn.innerText = "Aceptar esta Bendición y Continuar ➔";
      btn.onclick = () => {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      };
      area.appendChild(btn);
    }

    function advanceBeat() {
      const scene = storyData[currentSceneIdx];
      if (currentBeatIdx < scene.beats.length - 1) {
        currentBeatIdx++;
        renderBeat();
      } else {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) bgMusic.play();
      else bgMusic.pause();
    }

    window.onload = () => {
      renderScene();
    };
  </script>
</body>
</html>
