<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #06040d;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 12px;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 13, 32, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,215,0,0.05);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .chapter-tag {
      font-size: 0.75rem;
      color: #ffd700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;

      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    .character-box {
      width: 150px;
      height: 150px;
      margin: 0 auto 10px;
      position: relative;
    }
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.35));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    #fog-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      z-index: 5;
      cursor: pointer;
      touch-action: none;
    }

    .dialogue-box {
      background: rgba(8, 5, 16, 0.96);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 18px;
      padding: 16px;
      margin: 12px 0;

      text-align: left;
      font-size: 0.86rem;
      line-height: 1.65;
      color: #e3ddff;

    }

    .speaker-name {

      color: #ffd700;
      font-weight: 600;
      margin-bottom: 4px;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .interactive-area {
      margin: 10px 0;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #0c0914;
      font-weight: 600;
      border: none;
      padding: 13px 20px;
      border-radius: 50px;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 215, 0, 0.25);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn:active { transform: scale(0.96); }

    /* Canvas de Masaje de Tharun */
    #massage-canvas {
      width: 100%;
      height: 85px;
      background: rgba(40, 20, 10, 0.6);
      border: 2px dashed rgba(255, 120, 50, 0.5);
      border-radius: 16px;
      cursor: pointer;
      touch-action: none;
    }

    /* Mapa de Estrellas */
    .star-map {
      width: 100%;
      height: 105px;
      background: rgba(8,18,35,0.85);
      border: 1px dashed rgba(255,215,0,0.4);
      border-radius: 16px;
      position: relative;
      margin: 8px 0;
    }
    .star-point {
      width: 34px;
      height: 34px;
      background: #ffd700;
      border-radius: 50%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.78rem;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #ffd700;
      transition: transform 0.2s;
    }
    .star-point.active {
      background: #00ffcc;
      box-shadow: 0 0 20px #00ffcc;
    }

    /* Flip Card */
    .flip-card {
      width: 100%;
      height: 220px;
      perspective: 1000px;
      margin: 10px 0;
      display: none;
    }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%; height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px;
      border: 2px dashed #ffd700;
    }
    .flip-card-front {
      background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(15,10,25,0.95));
      color: #ffd700;
      cursor: pointer;
    }
    .flip-card-back {
      background: linear-gradient(135deg, rgba(25,20,45,0.95), rgba(10,5,20,0.98));

      transform: rotateY(180deg);
      border-style: solid;

    /* ESTILOS DE LA TARJETA EXPORTABLE AL FINAL */
    .export-card-wrapper {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .bday-card {

      text-align: center;

      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      overflow: hidden;

    .bday-card::before {
      content: '';

      top: 10px; left: 10px; right: 10px; bottom: 10px;

      pointer-events: none;

    .bday-card .sub-tag {

    .bday-card .highlight-gold {

    .bday-card .footer-text {

  <script>
    // WEB AUDIO API: VOICE BLIPS DE LOS PERSONAJES
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playVoiceBlip(speaker) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      let freq = 650;
      let waveType = 'sine';

      if (speaker.includes("Tharun")) {
        freq = 130; // Grave y místico
        waveType = 'triangle';
      } else if (speaker.includes("Lyra")) {
        freq = 980; // Cristalino y vibrante
        waveType = 'triangle';
      } else { 
        freq = 600 + Math.random() * 120; // Alegre y juguetón
        waveType = 'sine';
      }

      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(speaker.includes("Tharun") ? 0.25 : 0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (speaker.includes("Tharun") ? 0.15 : 0.08));
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + (speaker.includes("Tharun") ? 0.15 : 0.08));
    }

    const storyData = [

          { text: "¡Claro que volví! Sé que parezco un duende de Navidad perdido en el calendario, pero tu novio me dio la clave secreta para aparecer en tu cumpleaños.", type: "choice", btnText: "¿Qué clave secreta? 🤔" },
          { text: "Hace dos años me convertí en su cómplice oficial. Desde entonces, mi fecha favorita del año no es diciembre... es el día en que naciste tú.", type: "choice", btnText: "Recuerdo el ritual de hace dos años... ✨" },

        ],

      },
      {

        beats: [
          { text: "¡Qué dicha reencontrarnos, mi querida Eri! Soy Lyra, la Guardiana del Resplandor. Tu luz interior no ha dejado de evolucionar en este tiempo.", type: "choice", btnText: "¡Lyra! Qué lindo verte de nuevo ✨" },
          { text: "Para este nuevo año, regresamos a un lugar muy especial para ustedes: ¡Toda Bella Spa! El mismo refugio de belleza de hace dos años, preparado con una gran sorpresa.", type: "choice", btnText: "¿Qué sorpresa nos espera? 😍" },
          { text: "Prepárate para lucir radiante con un diseño de Morena Iluminada, acompañado de un corte de punta y un cepillado perfecto. Y como obsequio especial del salón... ¡depilación de cejas y bozo incluida!", type: "choice", btnText: "¡Me fascina la idea! ¿Cómo empezamos? ✂️" },
          { text: "Elige la tonalidad de luz perfecta para tu Morena Iluminada:", type: "style_choice_2" },
          { text: "¡Combinación perfecta! Todo está listo en Toda Bella Spa para tu sesión completa de Morena Iluminada, corte, cepillado y el regalo de depilación.", type: "show_card" }
        ],

      },
      {

          { text: "Ningún ritual de cumpleaños está completo sin un festín memorable. He apartado una mesa en un castillo suspendido sobre las olas del mar: La Rosa Náutica.", type: "choice", btnText: "¡Me encanta La Rosa Náutica! 😍" },
          { text: "Pero la verdadera magia está en la mesa. Una reina no celebra sola: este banquete será para brindar junto a la Reina Madre (tu mamá) que te dio la vida, y quien te ama a tu lado. Toca las 3 estrellas marinas para sellar la mesa:", type: "star_game" },
          { text: "¡Las tres estrellas del océano brillan alineadas! El mar está listo y la mesa servida para un almuerzo inolvidable sobre las olas.", type: "show_card" }
        ],
        cardContent: `
          <h3 style="color:#ffd700; margin-bottom:6px;">🍷 Festín en La Rosa Náutica</h3>
          <p style="font-size:0.85rem; line-height:1.5;">Almuerzo de celebración sobre el océano Pacífico junto a la <strong>Reina Madre (tu mamá)</strong> y quien te ama.</p>
        `
      },
      {
        chapter: "EPÍLOGO",
        title: "¡Feliz Cumpleaños, Eri!",
        speaker: "BimBin y tu Novio",
        image: "Bimbin-removebg-preview_20260726_231003_0000.png",
        beats: [
          { text: "Has completado el viaje de la Triple Corona. Cada una de estas tres experiencias ha sido elegida con todo el amor del mundo para que descanses, brilles y celebres lo increíble que eres. ¡Aquí tienes tu tarjeta de recuerdo!", type: "final_summary" }

    let currentSceneIdx = 0;
    let currentBeatIdx = 0;

    const bgMusic = document.getElementById('bgMusic');
    const sfxMagic = document.getElementById('sfxMagic');
    const sfxOcean = document.getElementById('sfxOcean');

    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = Array.from({length: 30}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.2,
      speed: Math.random() * 0.3 + 0.1
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
        ctx.fill();
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    function initFogCanvas() {
      const fogCanvas = document.getElementById('fog-canvas');
      const fogCtx = fogCanvas.getContext('2d');
      fogCanvas.width = 150;
      fogCanvas.height = 150;

      fogCtx.fillStyle = 'rgba(180, 195, 220, 0.92)';
      fogCtx.fillRect(0, 0, 150, 150);
      fogCtx.font = '600 11px Poppins';
      fogCtx.fillStyle = '#110c22';
      fogCtx.textAlign = 'center';
      fogCtx.fillText('FROTA AQUÍ ✨', 75, 75);
      fogCtx.fillText('PARA LIMPIAR', 75, 90);

      let isScratching = false;

      function scratch(e) {
        if (!isScratching) return;
        const rect = fogCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        fogCtx.globalCompositeOperation = 'destination-out';
        fogCtx.beginPath();
        fogCtx.arc(x, y, 22, 0, Math.PI * 2);
        fogCtx.fill();
      }

      fogCanvas.addEventListener('mousedown', (e) => { isScratching = true; scratch(e); });
      fogCanvas.addEventListener('mousemove', scratch);
      fogCanvas.addEventListener('mouseup', () => { isScratching = false; checkScratchProgress(); });

      fogCanvas.addEventListener('touchstart', (e) => { isScratching = true; scratch(e); });
      fogCanvas.addEventListener('touchmove', scratch);
      fogCanvas.addEventListener('touchend', () => { isScratching = false; checkScratchProgress(); });
    }

    function checkScratchProgress() {
      const fogCanvas = document.getElementById('fog-canvas');
      fogCanvas.style.transition = 'opacity 0.8s ease';
      fogCanvas.style.opacity = '0';
      setTimeout(() => {
        fogCanvas.style.display = 'none';
        sfxMagic.play();
        advanceBeat();
      }, 700);
    }

    function initMassageCanvas() {
      const mCanvas = document.getElementById('massage-canvas');
      const mCtx = mCanvas.getContext('2d');
      mCanvas.width = mCanvas.offsetWidth || 300;
      mCanvas.height = 85;

      let progress = 0;
      mCtx.fillStyle = '#3a1c10';
      mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
      mCtx.font = '500 13px Poppins';
      mCtx.fillStyle = '#ffd700';
      mCtx.textAlign = 'center';
      mCtx.fillText('Desliza tu dedo aquí para disipar la tensión 🌿', mCanvas.width / 2, 48);

      let isMassaging = false;

      function moveMassage(e) {
        if (!isMassaging) return;
        progress += 4;
        
        mCtx.fillStyle = `rgba(255, 140, 0, ${progress / 100})`;
        mCtx.fillRect(0, 0, (mCanvas.width * progress) / 100, mCanvas.height);

        mCtx.font = '500 13px Poppins';
        mCtx.fillStyle = '#fff';
        mCtx.textAlign = 'center';
        mCtx.fillText(`Liberando tensión... ${Math.min(progress, 100)}%`, mCanvas.width / 2, 48);

        if (progress >= 100) {
          isMassaging = false;
          sfxMagic.play();
          setTimeout(advanceBeat, 500);
        }
      }

      mCanvas.addEventListener('mousedown', () => { isMassaging = true; });
      mCanvas.addEventListener('mousemove', moveMassage);
      mCanvas.addEventListener('mouseup', () => { isMassaging = false; });

      mCanvas.addEventListener('touchstart', () => { isMassaging = true; });
      mCanvas.addEventListener('touchmove', moveMassage);
      mCanvas.addEventListener('touchend', () => { isMassaging = false; });
    }

    function typeWriter(text, speaker, callback) {
      let i = 0;
      const speed = 24;
      const element = document.getElementById('dialogue-text');
      element.innerHTML = "";

      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          if (i % 2 === 0) playVoiceBlip(speaker);
          i++;
          setTimeout(type, speed);
        } else {
          if (callback) callback();
        }
      }
      type();
    }

    function renderScene() {
      const scene = storyData[currentSceneIdx];
      document.getElementById('chapter-tag').innerText = scene.chapter;
      document.getElementById('scene-title').innerText = scene.title;
      document.getElementById('speaker-name').innerText = scene.speaker;
      document.getElementById('character-img').src = scene.image;

      const fogCanvas = document.getElementById('fog-canvas');
      if (currentSceneIdx === 0 && currentBeatIdx === 0) {
        fogCanvas.style.display = 'block';
        fogCanvas.style.opacity = '1';
        initFogCanvas();
      } else {
        fogCanvas.style.display = 'none';
      }

      document.getElementById('flip-card').style.display = 'none';
      document.getElementById('flip-card').classList.remove('flipped');

      renderBeat();
    }

    function renderBeat() {
      const scene = storyData[currentSceneIdx];
      const beat = scene.beats[currentBeatIdx];
      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      typeWriter(beat.text, scene.speaker, () => {
        if (beat.type === "choice") {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = beat.btnText;
          btn.onclick = () => {
            if (currentSceneIdx === 0 && currentBeatIdx === 1) {
              bgMusic.volume = 0.12;
              bgMusic.play().catch(e => console.log(e));
            }
            advanceBeat();
          };
          area.appendChild(btn);
        }

        else if (beat.type === "massage_game") {
          area.innerHTML = `<canvas id="massage-canvas"></canvas>`;
          setTimeout(initMassageCanvas, 50);
        }

        else if (beat.type === "style_choice_2") {
          area.innerHTML = `
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">🍯 Tono Miel Cálido & Suave</button>
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">🌰 Tono Avellana / Caramelo Iluminado</button>
          `;
        }

        else if (beat.type === "star_game") {
          let count = 0;
          const map = document.createElement('div');
          map.className = 'star-map';
          map.innerHTML = `
            <div class="star-point" style="top:20px; left:20px;" id="s1">Eri</div>
            <div class="star-point" style="top:52px; left:50%; transform:translateX(-50%);" id="s2">Novio</div>
            <div class="star-point" style="top:20px; right:20px;" id="s3">Mamá</div>
          `;
          area.appendChild(map);

          ['s1','s2','s3'].forEach((id) => {
            document.getElementById(id).onclick = function() {
              if(!this.classList.contains('active')) {
                this.classList.add('active');
                sfxMagic.play();
                count++;
                if(count === 3) {
                  setTimeout(advanceBeat, 600);
                }
              }
            };
          });
        }

        else if (beat.type === "show_card") {
          document.getElementById('card-back-content').innerHTML = scene.cardContent;
          document.getElementById('flip-card').style.display = 'block';
        }

        else if (beat.type === "final_summary") {
          sfxOcean.pause();
          confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });
          
          // MOSTRAR LA TARJETA VISUAL SUTIL CON BOTÓN DE DESCARGA
          area.innerHTML = `
            <div style="background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3); padding: 12px; border-radius: 16px; text-align: left; font-size: 0.81rem; line-height: 1.7; width:100%;">
              🌿 <strong>Acto I:</strong> Relax & Masaje Coco Premium (Vita Lima Spa)<br>
              ✂️ <strong>Acto II:</strong> Toda Bella Spa (Morena Iluminada + Corte + Cepillado)<br>
              🌊 <strong>Acto III:</strong> Almuerzo en La Rosa Náutica
            </div>

            <!-- TARJETA EXPORTABLE -->
            <div class="export-card-wrapper">
              <div class="bday-card" id="exportableBdayCard">
                <div>
                  <div class="sub-tag">EL RITUAL DE LOS CUIDADORES</div>
                  <div class="main-h1">¡Feliz Cumpleaños, Eri! 👑</div>
                </div>

                <div style="font-size: 1.2rem; margin: 8px 0;">✨ 👑 ✨</div>

                <div>
                  <p class="bday-text">
                    Un nuevo ciclo comienza hoy.<br>
                    <span class="highlight-gold">Tres momentos especiales</span> preparados con todo el amor para que descanses, brilles y celebres la gran persona que eres.
                  </p>
                </div>

                <div>
                  <div class="footer-text">CAPÍTULO II • CELEBRANDO TU VIDA</div>
                </div>
              </div>

              <button class="btn" style="margin-top:8px;" onclick="downloadSouvenirCard()">📸 Descargar mi Tarjeta de Recuerdo (PNG)</button>
            </div>

            <p style="font-size:0.85rem; color:#ffd700; font-weight:600; margin-top:14px;">Con todo nuestro amor,<br>Tu novio y BimBin.</p>
          `;
        }
      });
    }

    // FUNCIÓN PARA DESCARGAR LA TARJETA PNG
    function downloadSouvenirCard() {
      const card = document.getElementById('exportableBdayCard');
      html2canvas(card, {
        scale: 3,
        backgroundColor: null,
        useCORS: true
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Feliz_Cumpleanos_Eri_Ritual.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function revealGiftCard() {
      sfxMagic.currentTime = 0;
      sfxMagic.play();

      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');

      if (currentSceneIdx === 3) {
        sfxOcean.volume = 0.5;
        sfxOcean.play();
      }

      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.marginTop = '10px';
      btn.innerText = "Aceptar esta Bendición y Continuar ➔";
      btn.onclick = () => {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      };
      area.appendChild(btn);
    }

    function advanceBeat() {
      const scene = storyData[currentSceneIdx];
      if (currentBeatIdx < scene.beats.length - 1) {
        currentBeatIdx++;
        renderBeat();
      } else {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) bgMusic.play();
      else bgMusic.pause();
    }

    window.onload = () => {
      renderScene();
    };
  </script>
</body>
</html>
