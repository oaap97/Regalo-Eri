<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Ritual de los Cuidadores: Capítulo II</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #080511;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 15px;
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(20, 15, 35, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .chapter-tag {
      font-size: 0.75rem;
      color: #ffd700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .character-box {
      width: 160px;
      height: 160px;
      margin: 0 auto 8px;
      position: relative;
    }
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.35));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Caja RPG de Diálogo */
    .dialogue-box {
      background: rgba(10, 7, 20, 0.95);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 18px;
      padding: 16px;
      margin: 12px 0;
      min-height: 115px;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e2dcff;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }

    .speaker-name {
      font-size: 0.8rem;
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
      text-transform: uppercase;
    }

    /* Opciones y Mini-Juegos */
    .interactive-area {
      margin: 12px 0;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .btn {
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #0c0914;
      font-weight: 600;
      border: none;
      padding: 13px 20px;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 215, 0, 0.25);
      transition: all 0.25s ease;
      width: 100%;
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.96); }

    /* Círculo de Respiración */
    .breath-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.6), rgba(255,215,0,0.1));
      border: 2px solid #ffd700;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 3s linear;
      box-shadow: 0 0 20px rgba(255,215,0,0.4);
    }

    /* Mapa de Estrellas del Mar */
    .star-map {
      width: 100%;
      height: 120px;
      background: rgba(10,20,40,0.8);
      border: 1px dashed rgba(255,215,0,0.4);
      border-radius: 16px;
      position: relative;
      margin-bottom: 10px;
    }
    .star-point {
      width: 32px;
      height: 32px;
      background: #ffd700;
      border-radius: 50%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #ffd700;
      transition: transform 0.2s;
    }
    .star-point.active {
      background: #00ffcc;
      box-shadow: 0 0 20px #00ffcc;
    }

    /* Flip Card */
    .flip-card {
      width: 100%;
      height: 220px;
      perspective: 1000px;
      margin: 12px 0;
      display: none;
    }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%; height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
      border: 2px dashed #ffd700;
    }
    .flip-card-front {
      background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(15,10,25,0.95));
      color: #ffd700;
      cursor: pointer;
    }
    .flip-card-back {
      background: linear-gradient(135deg, rgba(25,20,45,0.95), rgba(10,5,20,0.98));
      color: white;
      transform: rotateY(180deg);
      border-style: solid;
    }

    .music-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <button class="music-btn" onclick="toggleMusic()">🎵</button>

    <div id="scene-header">
      <div class="chapter-tag" id="chapter-tag">PRÓLOGO</div>
      <h1 id="scene-title">El Espejo de la Memoria</h1>
    </div>

    <div class="character-box">
      <img id="character-img" src="Bimbin-removebg-preview_20260726_231003_0000.png" class="character-img" alt="Personaje">
    </div>

    <div class="dialogue-box">
      <span class="speaker-name" id="speaker-name">BimBin</span>
      <div id="dialogue-text"></div>
    </div>

    <!-- Área de interacción del juego -->
    <div class="interactive-area" id="interactive-area"></div>

    <!-- Carta de Regalo Oculta -->
    <div class="flip-card" id="flip-card" onclick="revealGiftCard()">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <span style="font-size:2rem; margin-bottom:6px;">✨</span>
          <p style="font-size:0.88rem; font-weight:600;">Toca para Romper el Sello Mágico</p>
        </div>
        <div class="flip-card-back" id="card-back-content"></div>
      </div>
    </div>

  </div>

  <!-- AUDIOS DE TU REPOSITORIO -->
  <audio id="bgMusic" src="royaltyfreemusicstudio-medieval-fantasy-music-462199.mp3" loop></audio>
  <audio id="sfxMagic" src="magic.mp3"></audio>
  <audio id="sfxOcean" src="dragon-studio-ocean-waves-376898.mp3"></audio>

  <script>
    // WEB AUDIO API: SINTETIZADOR DE "VOICE BLIPS" (Sonidos de los personajes)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playVoiceBlip(character) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      // Pitch según la voz del personaje
      let freq = 650;
      if (character === "Tharun") freq = 260; // Grave y suave
      if (character === "Lyra") freq = 950;   // Cristalino / Agudo
      if (character === "BimBin") freq = 620 + Math.random() * 100; // Juguetón

      osc.type = character === "Lyra" ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.06);
    }

    // NARRATIVA Y PASOS
    const storyData = [
      // ESCENA 0: PRÓLOGO CON BIMBIN
      {
        chapter: "PRÓLOGO",
        title: "El Despertar de BimBin",
        speaker: "BimBin",
        image: "Bimbin-removebg-preview_20260726_231003_0000.png",
        beats: [
          {
            text: "¡Psst! ¡Eri! Sí, acércate a la pantalla... ¡Limpiemos el polvo místico de la memoria para despertar el consejo!",
            type: "rub_screen",
            btnText: "🧹 Frotar el Espejo Mágico"
          },
          {
            text: "¡Eso es! ¡Aparecí! Sé que parezco un duende navideño fuera de temporada, pero tu novio me reclutó para volver en tu día especial. Hace dos años cuidamos de ti, ¡pero hoy venimos por más!",
            type: "choice",
            btnText: "¡BimBin! ¿Qué han preparado? ✨"
          }
        ]
      },

      // ESCENA 1: THARUN (MINI-JUEGO DE RESPIRACIÓN)
      {
        chapter: "ACTO I",
        title: "El Templo del Sosiego",
        speaker: "Tharun",
        image: "Tharun-removebg-preview_20260726_231150_0000.png",
        beats: [
          {
            text: "Saludos, Eri... Soy Tharun, Guardián del Descanso. Veo la tensión acumulada en tus hombros por tanto esfuerzo este año. Para entrar a mi templo, debemos liberar el aire.",
            type: "breathe_game"
          },
          {
            text: "Excelente. Has exhalado todo el peso. Ahora te aguarda un refugio de bálsamo de coco, piedras volcánicas cálidas y copa de vino para que renazcas.",
            type: "show_card"
          }
        ],
        cardContent: `<img src="Masajes.jpg" style="width:100%; height:100%; object-fit:cover; border-radius:16px;" alt="Vita Lima Spa">`
      },

      // ESCENA 2: LYRA (PIGMENTOS DE LUZ)
      {
        chapter: "ACTO II",
        title: "El Espejo del Sol",
        speaker: "Lyra",
        image: "Lyra-removebg-preview_20260726_231211_0000.png",
        beats: [
          {
            text: "¡Qué dicha verte de nuevo, Eri! Soy Lyra. Tu luz interior ha crecido tanto que exige una nueva corona exterior. Elige cuál es tu energía hoy:",
            type: "aura_choice"
          },
          {
            text: "¡Una elección perfecta! Con esos matices de luz esculpiremos tu cabello con un corte personalizado y la coloración radiante que mereces.",
            type: "show_card"
          }
        ],
        cardContent: `
          <h3 style="color:#ffd700; margin-bottom:6px;">✨ Experiencia de Estilo Real</h3>
          <p style="font-size:0.85rem; line-height:1.5;">Una sesión de renovación completa:<br><strong>Corte Personalizado + Coloración</strong><br>para matizar tu corona de luz.</p>
        `
      },

      // ESCENA 3: BIMBIM (CONECTAR 3 ESTRELLAS)
      {
        chapter: "ACTO III",
        title: "El Banquete sobre el Mar",
        speaker: "BimBin",
        image: "Bimbin-removebg-preview_20260726_231003_0000.png",
        beats: [
          {
            text: "¡Llegamos al acto final! Te he preparado un banquete sobre las olas del océano en La Rosa Náutica. Para abrir la mesa real, toca las 3 estrellas de la compañía:",
            type: "star_game"
          },
          {
            text: "¡Las tres estrellas se han alineado! Brindaremos sobre las olas junto a la Reina Madre (tu mamá) y quien camina a tu lado.",
            type: "show_card"
          }
        ],
        cardContent: `
          <h3 style="color:#ffd700; margin-bottom:6px;">🍷 Festín en La Rosa Náutica</h3>
          <p style="font-size:0.85rem; line-height:1.5;">Almuerzo de celebración sobre el océano Pacífico junto a la <strong>Reina Madre (tu mamá)</strong> y quien te ama.</p>
        `
      },

      // ESCENA 4: EPÍLOGO
      {
        chapter: "EPÍLOGO",
        title: "¡Feliz Cumpleaños, Eri!",
        speaker: "BimBin y tu Novio",
        image: "Bimbin-removebg-preview_20260726_231003_0000.png",
        beats: [
          {
            text: "Has completado el viaje de los Tres Cuidadores. Cada experiencia ha sido preparada con amor para que descanses, brilles y celebres como la reina que eres.",
            type: "final_summary"
          }
        ]
      }
    ];

    let currentSceneIdx = 0;
    let currentBeatIdx = 0;

    const bgMusic = document.getElementById('bgMusic');
    const sfxMagic = document.getElementById('sfxMagic');
    const sfxOcean = document.getElementById('sfxOcean');

    // Muro de partículas sutiles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = Array.from({length: 30}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.2,
      speed: Math.random() * 0.3 + 0.1
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
        ctx.fill();
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // Typewriter con sonidito Blip
    function typeWriter(text, speaker, callback) {
      let i = 0;
      const speed = 25;
      const element = document.getElementById('dialogue-text');
      element.innerHTML = "";

      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          if (i % 2 === 0) playVoiceBlip(speaker); // Emitir sonido cada 2 letras
          i++;
          setTimeout(type, speed);
        } else {
          if (callback) callback();
        }
      }
      type();
    }

    function renderScene() {
      const scene = storyData[currentSceneIdx];
      document.getElementById('chapter-tag').innerText = scene.chapter;
      document.getElementById('scene-title').innerText = scene.title;
      document.getElementById('speaker-name').innerText = scene.speaker;
      document.getElementById('character-img').src = scene.image;

      document.getElementById('flip-card').style.display = 'none';
      document.getElementById('flip-card').classList.remove('flipped');

      renderBeat();
    }

    function renderBeat() {
      const scene = storyData[currentSceneIdx];
      const beat = scene.beats[currentBeatIdx];
      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      typeWriter(beat.text, scene.speaker, () => {
        // Al terminar el diálogo, renderizar el tipo de interacción
        if (beat.type === "rub_screen" || beat.type === "choice") {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = beat.btnText;
          btn.onclick = () => {
            if (currentSceneIdx === 0 && currentBeatIdx === 0) {
              bgMusic.volume = 0.35;
              bgMusic.play().catch(e=>console.log(e));
            }
            advanceBeat();
          };
          area.appendChild(btn);
        }
        
        else if (beat.type === "breathe_game") {
          const circle = document.createElement('div');
          circle.className = 'breath-circle';
          circle.innerText = "MANTÉN 3s";
          let timer;
          
          const startBreathe = () => {
            circle.style.transform = "scale(1.3)";
            circle.innerText = "EXHALA...";
            timer = setTimeout(() => {
              sfxMagic.play();
              advanceBeat();
            }, 2500);
          };

          const stopBreathe = () => {
            clearTimeout(timer);
            circle.style.transform = "scale(1)";
            circle.innerText = "MANTÉN 3s";
          };

          circle.addEventListener('touchstart', startBreathe);
          circle.addEventListener('touchend', stopBreathe);
          circle.addEventListener('mousedown', startBreathe);
          circle.addEventListener('mouseup', stopBreathe);

          area.appendChild(circle);
        }

        else if (beat.type === "aura_choice") {
          area.innerHTML = `
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">✨ Cobre Cálido Radiante</button>
            <button class="btn" onclick="sfxMagic.play(); advanceBeat();">🌟 Dorado Sol de Cumpleaños</button>
          `;
        }

        else if (beat.type === "star_game") {
          let count = 0;
          const map = document.createElement('div');
          map.className = 'star-map';
          map.innerHTML = `
            <div class="star-point" style="top:20px; left:20px;" id="s1">1</div>
            <div class="star-point" style="top:60px; left:50%; transform:translateX(-50%);" id="s2">2</div>
            <div class="star-point" style="top:20px; right:20px;" id="s3">3</div>
          `;
          area.appendChild(map);

          ['s1','s2','s3'].forEach((id, idx) => {
            document.getElementById(id).onclick = function() {
              if(!this.classList.contains('active')) {
                this.classList.add('active');
                sfxMagic.play();
                count++;
                if(count === 3) {
                  setTimeout(advanceBeat, 600);
                }
              }
            };
          });
        }

        else if (beat.type === "show_card") {
          document.getElementById('card-back-content').innerHTML = scene.cardContent;
          document.getElementById('flip-card').style.display = 'block';
        }

        else if (beat.type === "final_summary") {
          sfxOcean.pause();
          confetti({ particleCount: 130, spread: 90, origin: { y: 0.6 } });
          area.innerHTML = `
            <div style="background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3); padding: 14px; border-radius: 16px; text-align: left; font-size: 0.82rem; line-height: 1.8;">
              🌿 <strong>Acto I:</strong> Relax & Masaje Coco Premium (Vita Lima Spa)<br>
              ✂️ <strong>Acto II:</strong> Corte & Coloración de Cabello<br>
              🌊 <strong>Acto III:</strong> Almuerzo en La Rosa Náutica
            </div>
            <p style="font-size:0.85rem; color:#ffd700; font-weight:600; margin-top:12px;">Con todo nuestro amor,<br>Tu novio y BimBin.</p>
          `;
        }
      });
    }

    function revealGiftCard() {
      sfxMagic.currentTime = 0;
      sfxMagic.play();

      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');

      if (currentSceneIdx === 3) {
        sfxOcean.volume = 0.5;
        sfxOcean.play();
      }

      const area = document.getElementById('interactive-area');
      area.innerHTML = "";

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.marginTop = '10px';
      btn.innerText = "Aceptar esta Bendición y Continuar ➔";
      btn.onclick = () => {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      };
      area.appendChild(btn);
    }

    function advanceBeat() {
      const scene = storyData[currentSceneIdx];
      if (currentBeatIdx < scene.beats.length - 1) {
        currentBeatIdx++;
        renderBeat();
      } else {
        currentSceneIdx++;
        currentBeatIdx = 0;
        renderScene();
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) bgMusic.play();
      else bgMusic.pause();
    }

    window.onload = () => {
      renderScene();
    };
  </script>
</body>
</html>
